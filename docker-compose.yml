services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - postgres_user
      - postgres_password

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        mkdir -p /opt/keycloak/data/import
        # Use bash parameter expansion (not sed) so passwords containing
        # sed metacharacters like | & \ / are substituted literally.
        template="$$(cat /opt/keycloak/data/import-template/realm-local-rag.json)"
        template="$${template//__RAG_ADMIN_PASSWORD__/$$(cat /run/secrets/rag_admin_password)}"
        template="$${template//__RAG_USER_PASSWORD__/$$(cat /run/secrets/rag_user_password)}"
        printf '%s' "$$template" > /opt/keycloak/data/import/realm-local-rag.json
        export KC_BOOTSTRAP_ADMIN_USERNAME="$$(cat /run/secrets/keycloak_admin_user)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import-template:ro
    secrets:
      - keycloak_admin_user
      - keycloak_admin_password
      - rag_admin_password
      - rag_user_password
    healthcheck:
      # Invoke bash explicitly: the /dev/tcp redirection is a bash extension and
      # the base image's /bin/sh (used by CMD-SHELL) is not guaranteed to be bash.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ragdb
      # Datasource username/password are read from /run/secrets via Spring's configtree
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/local-rag
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/local-rag/protocol/openid-connect/certs
    secrets:
      - source: postgres_user
        target: spring.datasource.username
      - source: postgres_password
        target: spring.datasource.password
    depends_on:
      db:
        condition: service_started
      keycloak:
        condition: service_healthy

volumes:
  pgdata:

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  keycloak_admin_user:
    file: ./secrets/keycloak_admin_user.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
  rag_admin_password:
    file: ./secrets/rag_admin_password.txt
  rag_user_password:
    file: ./secrets/rag_user_password.txt
