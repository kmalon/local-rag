plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'pl.km'
version = '1.0-SNAPSHOT'
java { sourceCompatibility = JavaVersion.VERSION_21 }

repositories {
    mavenCentral()
}

ext {
    // 1.1.x is the first line shipping the MCP Streamable HTTP transports (MCP Java SDK 0.18.x);
    // it is built against Spring Boot 3.5.x, hence the Boot version above.
    set('springAiVersion', '1.1.8')
}

dependencies {
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.springframework.ai:spring-ai-transformers'
    implementation 'org.springframework.ai:spring-ai-tika-document-reader'
    // MCP server (Streamable HTTP over Spring MVC) exposing the RAG knowledge base to AI agents.
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    // Cross-encoder reranker: HuggingFace tokenizer + ONNX Runtime inference.
    // Versions align with those already pulled transitively by spring-ai-transformers (Spring AI 1.1.8).
    implementation 'ai.djl.huggingface:tokenizers:0.32.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.20.0'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integration-test/java'
        resources.srcDir 'src/integration-test/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

test {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
}

tasks.named('check') { dependsOn 'integrationTest' }
