spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: raguser
    password: ragpass
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 384

rag:
  chunking:
    chunk-size: 1000
    overlap-ratio: 0.2
  query:
    default-score-threshold: 0.75
