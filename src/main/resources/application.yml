spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: ${POSTGRES_USER:raguser}
    password: ${POSTGRES_PASSWORD:ragpass}
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 384
    mcp:
      server:
        name: local-rag-mcp
        # Reported to clients in the MCP handshake; keep in step with the Gradle project version.
        version: ${MCP_SERVER_VERSION:1.0-SNAPSHOT}
        type: SYNC
        # Streamable HTTP without sessions: every tools/call is a self-contained POST
        # answered with a JSON body — no session id, no SSE stream, no server-initiated
        # traffic. Matches the stateless bearer-token model the filter chains already use.
        protocol: STATELESS
        # Single endpoint, matched by the MCP security chain, and the same URI the
        # RFC 9728 metadata below advertises as the protected resource.
        streamable-http:
          mcp-endpoint: /mcp

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/local-rag}
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/local-rag/protocol/openid-connect/certs}
  audience:
    # Broad: shared by the platform's ordinary APIs, so one token serves them all.
    # Supplied by the `rag-api` client scope, held only by `rag-api-client`.
    api: ${API_AUDIENCE:rag-platform}
    # Narrow: MCP only, so an agent's token cannot be replayed against other APIs.
    # Supplied by the `rag-mcp-api` client scope, held only by `rag-mcp-client`.
    mcp: ${MCP_AUDIENCE:rag-mcp}

mcp:
  # RFC 9728 resource identifier of the MCP server (a URI, unlike the `aud` value above).
  # Drives the metadata document and the well-known path in the 401 challenge.
  resource: ${MCP_RESOURCE:http://localhost:8080/mcp}

rag:
  chunking:
    chunk-size: 1000
    overlap-ratio: 0.2
  query:
    # Threshold now applies to the RERANKER (cross-encoder) score, not raw vector similarity.
    default-score-threshold: 0.75
    # The candidate pool is derived from the request: topK * over-fetch-factor, held between
    # min- and max-candidates. The factor is what makes reranking worth doing — the
    # cross-encoder picks topK winners out of that many candidates instead of merely
    # reordering the ones vector search already chose.
    over-fetch-factor: 4
    # Floor, so a topK of 1 still reranks a real field rather than 4 candidates.
    min-candidates: 20
    # Cost ceiling: the most reranker inferences one query can trigger. Divided by the factor
    # it is also the largest servable topK (80/4 = 20) for both REST and MCP.
    max-candidates: 80
  reranker:
    # Local cross-encoder ONNX model + tokenizer (e.g. Xenova/ms-marco-MiniLM-L-6-v2).
    # Override with file:/... or https://... URIs; classpath default expects files under resources/models/reranker/.
    model-uri: ${RERANKER_MODEL_URI:classpath:models/reranker/model.onnx}
    tokenizer-uri: ${RERANKER_TOKENIZER_URI:classpath:models/reranker/tokenizer.json}
