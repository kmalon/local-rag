apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: local-rag

resources:
  - namespace.yaml
  - postgres.yaml
  - keycloak.yaml
  - app.yaml
  - hpa.yaml

# The Secrets and the `keycloak-realm` ConfigMap are deliberately not generated here:
# they are built by deploy.sh from files outside this directory (secrets/*.txt and
# keycloak/realm-local-rag.json), which kustomize refuses to read, and the secret
# values must never end up in a tracked manifest.

# `includeSelectors: false` on purpose: a label folded into a Deployment's selector is
# immutable afterwards, so keep this purely descriptive (`kubectl get all -l ...`).
labels:
  - pairs:
      app.kubernetes.io/part-of: local-rag
    includeSelectors: false
